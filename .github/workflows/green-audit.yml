name: Green IT & Performance Audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Medir y verificar Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
      - name: Guardar reportes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            src/frontend/.lighthouseci/
            src/frontend/lhci-reports/
          if-no-files-found: warn
          retention-days: 14
